name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install pytest
      - name: Unit and end-to-end tests (stub backend, no network)
        run: python -m pytest tests/ -q
      - name: Stub benchmark smoke
        run: python -m lumen2.bench --model stub --out stub-ci
      - name: Stub fix + ask smoke
        shell: bash
        run: |
          cp -r bench/fixtures/off_by_one/target /tmp/smoke-target
          python -m lumen2 fix /tmp/smoke-target
          python -m lumen2 ask "what is 21 * 2?"

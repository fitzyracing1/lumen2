[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen2"
version = "2.0.0"
description = "Lumen 2 — a bounded kernel that makes a tool-using coding agent check its own work before it acts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fitzyracing1" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lumen2 = "lumen2.cli:main"

[tool.setuptools.packages.find]
include = ["lumen2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
